name: Purge reverted GN Plus HTML cache
on:
  push:
    paths:
      - '.github/workflows/purge-reverted-base.yml'
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr HTML endpoints
        shell: bash
        run: |
          set -euo pipefail
          for version in latest main; do
            url="https://purge.jsdelivr.net/gh/sarb-s/gn-plus@${version}/gnplus-stable.html"
            echo "Purging $url"
            curl --fail --show-error --silent --max-time 30 "$url"
            echo
          done
